<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AutoDev Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f172a;

            color: #e2e8f0;
        }

        header {

            padding: 24px 32px;

            background: #111827;

            border-bottom:
                1px solid #334155;
        }

        header h1 {

            margin: 0;

            color: #38bdf8;
        }

        header p {

            margin-top: 8px;

            color: #94a3b8;
        }

        .container {

            display: grid;

            grid-template-columns:
                360px 1fr;

            min-height:
                calc(100vh - 105px);
        }

        .sidebar {

            padding: 24px;

            background: #111827;

            border-right:
                1px solid #334155;

            overflow-y: auto;
        }

        .content {

            padding: 24px;

            overflow-y: auto;

            position: relative;
        }

        button {

            border: none;

            padding: 9px 13px;

            margin: 4px;

            border-radius: 6px;

            cursor: pointer;

            background: #2563eb;

            color: white;

            font-size: 14px;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        button:hover {

            background: #1d4ed8;

            transform:
                translateY(-1px);
        }

        .clear-preview {

            margin:
                0 0 18px 0;

            background: #475569;

            font-weight: 600;
        }

        .clear-preview:hover {

            background: #64748b;
        }

        .file {

            margin-top: 12px;

            padding: 14px;

            background: #1e293b;

            border:
                1px solid #334155;

            border-radius: 8px;
        }

        .file-name {

            font-weight: bold;

            margin-bottom: 8px;

            word-break: break-all;
        }

        .file-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 4px;
        }

        .delete-button {

            background: #dc2626;
        }

        .delete-button:hover {

            background: #b91c1c;
        }

        .status {

            padding: 14px;

            margin-bottom: 20px;

            background: #1e293b;

            border-radius: 8px;

            color: #94a3b8;
        }

        .preview {

            background: #020617;

            border:
                1px solid #334155;

            border-radius: 8px;

            overflow: auto;
        }

        pre {

            margin: 0;

            padding: 20px;

            min-height: 500px;

            white-space: pre-wrap;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            color: #d1fae5;

            line-height: 1.6;
        }

        .empty {

            color: #64748b;

            padding: 20px 0;
        }

        .preview-empty {

            color: #64748b;

            text-align: center;

            padding-top: 180px;

            min-height: 500px;
        }

        .file-count {

            color: #94a3b8;

            margin-bottom: 12px;

            font-size: 14px;
        }

        @media (
            max-width: 900px
        ) {

            .container {

                grid-template-columns:
                    1fr;
            }

            .sidebar {

                border-right: none;

                border-bottom:
                    1px solid #334155;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>🚀 AutoDev Agent</h1>

    <p>
        AI-powered code generation,
        execution, self-healing and code management
    </p>

</header>


<div class="container">


    <!-- =====================================================
         FILE SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <h2>📁 Generated Files</h2>

        <button
            onclick="loadFiles()"
        >
            🔄 Refresh Files
        </button>

        <div
            id="file-count"
            class="file-count"
        >
            Loading files...
        </div>

        <div id="files">

            Loading...

        </div>

    </aside>


    <!-- =====================================================
         CODE PREVIEW
    ====================================================== -->

    <main class="content">


        <!-- CLEAR PREVIEW -->

        <button
            class="clear-preview"
            onclick="clearPreview()"
        >
            🔄 Clear Preview
        </button>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
        >
            Select a generated file to preview it.
        </div>


        <!-- CODE TITLE -->

        <h2>
            📄 Code Preview
        </h2>


        <!-- CODE -->

        <div class="preview">

            <pre
                id="preview"
                class="preview-empty"
            >No file selected.</pre>

        </div>


    </main>


</div>


<script>


// ============================================================
// CURRENTLY SELECTED FILE
// ============================================================

let selectedFile = null;


// ============================================================
// LOAD GENERATED FILES
// ============================================================

async function loadFiles() {

    const container =
        document.getElementById(
            "files"
        );

    const count =
        document.getElementById(
            "file-count"
        );

    try {

        container.innerHTML =
            "Loading...";

        const response =
            await fetch(
                "/generated-files"
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        container.innerHTML = "";

        count.textContent =
            `${data.count || 0} generated file(s)`;


        if (
            !data.files ||
            data.files.length === 0
        ) {

            container.innerHTML =
                '<div class="empty">' +
                'No generated files yet.' +
                '</div>';

            return;
        }


        data.files.forEach(
            function(file) {

                // ------------------------------------------------
                // CARD
                // ------------------------------------------------

                const wrapper =
                    document.createElement(
                        "div"
                    );

                wrapper.className =
                    "file";


                // ------------------------------------------------
                // FILE NAME
                // ------------------------------------------------

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "file-name";

                name.textContent =
                    "🐍 " +
                    file.name;


                // ------------------------------------------------
                // ACTION CONTAINER
                // ------------------------------------------------

                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "file-actions";


                // ------------------------------------------------
                // VIEW BUTTON
                // ------------------------------------------------

                const viewButton =
                    document.createElement(
                        "button"
                    );

                viewButton.textContent =
                    "👁 View";

                viewButton.onclick =
                    function() {

                        viewFile(
                            file.name
                        );

                    };


                // ------------------------------------------------
                // DOWNLOAD BUTTON
                // ------------------------------------------------

                const downloadButton =
                    document.createElement(
                        "button"
                    );

                downloadButton.textContent =
                    "⬇ Download";

                downloadButton.onclick =
                    function() {

                        window.location.href =
                            file.download_url;

                    };


                // ------------------------------------------------
                // DELETE BUTTON
                // ------------------------------------------------

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.textContent =
                    "🗑 Delete";

                deleteButton.className =
                    "delete-button";

                deleteButton.onclick =
                    function() {

                        deleteFile(
                            file.name
                        );

                    };


                // ------------------------------------------------
                // ADD BUTTONS
                // ------------------------------------------------

                actions.appendChild(
                    viewButton
                );

                actions.appendChild(
                    downloadButton
                );

                actions.appendChild(
                    deleteButton
                );


                wrapper.appendChild(
                    name
                );

                wrapper.appendChild(
                    actions
                );

                container.appendChild(
                    wrapper
                );

            }
        );

    }

    catch (error) {

        container.innerHTML =
            "❌ Failed to load files.";

        count.textContent =
            "Unable to load file count.";

        console.error(error);

    }

}


// ============================================================
// VIEW GENERATED CODE
// ============================================================

async function viewFile(
    filename
) {

    const preview =
        document.getElementById(
            "preview"
        );

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.textContent =
            "Loading " +
            filename +
            "...";


        const url =
            "/view/" +
            encodeURIComponent(
                filename
            );


        const response =
            await fetch(
                url
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const code =
            await response.text();


        preview.textContent =
            code;


        preview.classList.remove(
            "preview-empty"
        );


        selectedFile =
            filename;


        status.textContent =
            "Viewing: " +
            filename;

    }

    catch (error) {

        preview.textContent =
            "❌ Unable to load code.";

        preview.classList.add(
            "preview-empty"
        );

        status.textContent =
            "Error: " +
            error.message;

        console.error(error);

    }

}


// ============================================================
// DELETE GENERATED FILE
// ============================================================

async function deleteFile(
    filename
) {

    const confirmed =
        window.confirm(
            `Are you sure you want to delete "${filename}"?`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                "/generated-files/" +
                encodeURIComponent(
                    filename
                ),
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Failed to delete file."
            );

        }


        // ----------------------------------------------------
        // CLEAR PREVIEW IF DELETED FILE WAS OPEN
        // ----------------------------------------------------

        if (
            selectedFile === filename
        ) {

            clearPreview();

        }


        // ----------------------------------------------------
        // REFRESH FILE LIST
        // ----------------------------------------------------

        await loadFiles();


        console.log(
            "Deleted:",
            filename
        );

    }

    catch (error) {

        alert(
            "❌ Delete failed: " +
            error.message
        );

        console.error(error);

    }

}


// ============================================================
// CLEAR PREVIEW
// ============================================================

function clearPreview() {

    const preview =
        document.getElementById(
            "preview"
        );

    const status =
        document.getElementById(
            "status"
        );


    preview.textContent =
        "No file selected.";


    preview.classList.add(
        "preview-empty"
    );


    status.textContent =
        "Select a generated file to preview it.";


    selectedFile =
        null;

}


// ============================================================
// CLEAR PREVIEW WHEN PAGE IS RESTORED
// ============================================================

window.addEventListener(
    "pageshow",
    function() {

        clearPreview();

    }
);


// ============================================================
// INITIAL LOAD
// ============================================================

loadFiles();


// Make sure preview starts empty

clearPreview();


</script>


</body>

</html>
