services:
  autodev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodev-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - autodev_tasks:/data/tasks
      - autodev_projects:/app/generated
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  autodev_tasks:
  autodev_projects:
