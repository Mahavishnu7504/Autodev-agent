services:
  autodev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodev-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCKER_HOST: tcp://sandbox-engine:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      AUTODEV_STATE_DIR: /data/tasks
    ports:
      - "8000:8000"
    volumes:
      - autodev_tasks:/data/tasks
      - autodev_projects:/app/generated
      - sandbox_engine_certs:/certs:ro
    depends_on:
      sandbox-engine:
        condition: service_healthy
    networks:
      - autodev-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sandbox-engine:
    image: docker:29-dind
    container_name: autodev-sandbox-engine
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:sandbox-engine
    volumes:
      - sandbox_engine_data:/var/lib/docker
      - sandbox_engine_certs:/certs
    expose:
      - "2376"
    networks:
      - autodev-network
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

networks:
  autodev-network:
    driver: bridge

volumes:
  autodev_tasks:
  autodev_projects:
  sandbox_engine_data:
  sandbox_engine_certs:



